<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b57d0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="レジ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>レジ</title>
<style>
:root{--blue:#0b57d0;--bg:#f2f6fd;--line:#cfdcf5;--text:#14213d;--sub:#64748b;--danger:#d93025}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:640px;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:16px/1.4 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #7aa7f5;outline-offset:2px}
header{flex:none;display:flex;align-items:center;gap:4px;background:var(--blue);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px 16px}
header h1{flex:1;margin:0;font-size:22px}
.hb{background:none;border:0;color:#fff;padding:8px 10px;border-radius:10px;font-size:15px;font-weight:700}
.hb:active{background:rgba(255,255,255,.18)}
main{flex:1;overflow:auto;padding:12px 14px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 8px;font-size:13px;font-weight:700;color:var(--sub)}
.lnk{background:none;border:0;color:var(--blue);font-size:13px;font-weight:700;padding:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.tile{min-height:70px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow-wrap:anywhere}
.tile b{color:var(--blue)}
.tile:active{background:#e3edff;transform:scale(.98)}
.tile.new{border-style:dashed;color:var(--blue);align-items:center;justify-content:center;font-weight:700;background:transparent}
.row{display:grid;grid-template-columns:1fr auto 68px 30px;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 6px 8px 12px;margin-bottom:8px}
.nm b{display:block;overflow-wrap:anywhere}
.nm small{color:var(--sub)}
.qty{display:flex;align-items:center;gap:6px}
.qty span{min-width:28px;text-align:center;font-size:18px;font-weight:700}
.rb{width:38px;height:38px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:22px;line-height:1}
.sub{text-align:right;font-weight:700}
.del{border:0;background:none;color:#94a3b8;padding:4px;display:flex}
.empty{color:var(--sub);text-align:center;padding:18px 0;margin:0}
footer{flex:none;background:#fff;border-top:1.5px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.tot b{font-size:36px;color:var(--blue)}
.go{width:100%;height:58px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-size:22px;font-weight:700}
.go:disabled{background:#b6c6e6}
dialog{border:0;border-radius:20px;padding:0;width:min(92vw,420px);max-height:88dvh;overflow:hidden;color:var(--text)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(15,23,42,.5)}
.dh{flex:none;display:flex;justify-content:space-between;align-items:center;background:var(--blue);color:#fff;padding:14px 16px;font-size:19px;font-weight:700}
.x{background:none;border:0;color:#fff;font-size:20px;padding:0 4px}
.db{padding:16px;overflow:auto}
label{display:block;font-weight:700;margin:0 0 6px}
.in{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:18px;margin-bottom:14px}
.suf{position:relative}.suf i{position:absolute;right:14px;top:14px;font-style:normal;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:50px;border-radius:12px;border:1.5px solid var(--line);background:#eef4ff;font-weight:700}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.45}
.btn.d{color:var(--danger);background:#fff}
.big{font-size:40px;font-weight:700;color:var(--blue);text-align:right;margin:0 0 10px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chg{font-size:22px;font-weight:700;text-align:right;margin:0 0 14px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.li small{display:block;color:var(--sub)}
.li .btn{height:38px;padding:0 12px;font-size:14px}
.stack{display:grid;gap:10px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14213d;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
[hidden]{display:none!important}
#conn{font-style:normal;font-size:12px;font-weight:400;margin-left:6px}
#conn.on{color:#8cf0b0}#conn.off{color:#cbd5e1}#conn.hide{display:none}
#tabs{flex:none;display:flex;background:#fff;border-bottom:1.5px solid var(--line)}
#tabs button{flex:1;height:46px;border:0;background:none;font-weight:700;color:var(--sub);border-bottom:3px solid transparent}
#tabs .on{color:var(--blue);border-color:var(--blue)}
.bd{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--danger);color:#fff;font-size:13px;margin-left:6px}
.bd:empty{display:none}
.oc{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.oc.new{border-color:#f59e0b;background:#fffbeb}
.oc.cooking{border-color:var(--blue);background:#eef4ff}
.oh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.oh b{font-size:26px}.oh span{color:var(--sub);font-size:14px}
.oc ul{list-style:none;margin:0 0 10px;padding:0;font-size:19px}
.oc li{display:flex;justify-content:space-between;padding:3px 0}
.call{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#e8f7ee;border:2px solid #34a853;border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:8px;font-size:18px}
.call .btn{height:42px;padding:0 14px}
textarea.in{height:130px;padding:10px 14px;font-size:13px;resize:vertical}
.hint{font-size:13px;color:var(--sub);margin:0 0 14px}
</style>
</head>
<body>
<header>
  <h1>レジ<i id="conn" class="hide"></i></h1>
  <button class="hb" id="bHist">履歴</button>
  <button class="hb" id="bSet">設定</button>
</header>
<nav id="tabs" hidden>
  <button data-view="reji">レジ</button>
  <button data-view="prep">準備<span class="bd" id="bd"></span></button>
</nav>
<main id="vReji">
  <div id="calls"></div>
  <div class="sec"><span>商品（タップで追加）</span></div>
  <div class="grid" id="grid"></div>
  <div class="sec"><span>注文</span><button class="lnk" id="clr">すべて取り消す</button></div>
  <div id="cart"></div>
</main>
<main id="vPrep" hidden>
  <div id="plist"></div>
</main>
<footer id="fReji">
  <div class="tot"><span>合計金額</span><b id="total">0円</b></div>
  <button class="go" id="pay" disabled>お会計</button>
</footer>

<dialog id="dProd">
  <div class="dh"><span id="dpT">商品を登録</span><button class="x" data-close aria-label="閉じる">✕</button></div>
  <div class="db">
    <label for="pn">商品名</label>
    <input class="in" id="pn" placeholder="例）ペットボトル（500ml）" autocomplete="off">
    <label for="pp">価格（税込）</label>
    <div class="suf"><input class="in" id="pp" type="number" inputmode="numeric" min="0" placeholder="例）100"><i>円</i></div>
    <div class="two"><button class="btn" data-close>キャンセル</button><button class="btn p" id="pSave">登録</button></div>
  </div>
</dialog>

<dialog id="dPay">
  <div class="dh"><span>お会計</span><button class="x" data-close aria-label="閉じる">✕</button></div>
  <div class="db">
    <p class="big" id="ptot">0円</p>
    <label for="paid">お預かり</label>
    <div class="suf"><input class="in" id="paid" type="number" inputmode="numeric" min="0" placeholder="0"><i>円</i></div>
    <div class="quick">
      <button class="btn" data-amt="exact">ちょうど</button>
      <button class="btn" data-amt="1000">＋1,000</button>
      <button class="btn" data-amt="5000">＋5,000</button>
      <button class="btn" data-amt="10000">＋10,000</button>
      <button class="btn" data-amt="500">＋500</button>
      <button class="btn" data-amt="clr">クリア</button>
    </div>
    <p class="chg" id="chg"></p>
    <div class="two"><button class="btn" data-close>戻る</button><button class="btn p" id="ok">会計を確定</button></div>
  </div>
</dialog>

<dialog id="dHist">
  <div class="dh"><span>売上履歴</span><button class="x" data-close aria-label="閉じる">✕</button></div>
  <div class="db"><p id="hsum" style="margin:0 0 6px;font-size:17px"></p><div id="hlist"></div></div>
</dialog>

<dialog id="dSet">
  <div class="dh"><span>設定</span><button class="x" data-close aria-label="閉じる">✕</button></div>
  <div class="db">
    <div class="sec"><span>登録済みの商品</span></div>
    <div id="slist"></div>
    <div class="stack">
      <button class="btn p" id="bLink">複数台で連携する（クラウド）</button>
      <button class="btn" id="bCsv">売上をCSVで保存</button>
      <button class="btn d" id="bWipe">売上履歴をすべて削除</button>
      <p class="empty" style="padding:0">データはこの端末の中にだけ保存されます。</p>
    </div>
  </div>
</dialog>
<dialog id="dLink">
  <div class="dh"><span>複数台で連携</span><button class="x" data-close aria-label="閉じる">✕</button></div>
  <div class="db">
    <label for="shop">店舗コード</label>
    <input class="in" id="shop" placeholder="例）okinawa-2026-xxxx" autocomplete="off" autocapitalize="off" style="margin-bottom:6px">
    <p class="hint">全端末で同じコードにします。他の人に知られないよう、長めで推測されにくいものにしてください。</p>
    <label for="fbcfg">Firebase の設定</label>
    <textarea class="in" id="fbcfg" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-bottom:6px"></textarea>
    <p class="hint">Firebase コンソールの「プロジェクトの設定」→「マイアプリ」にある firebaseConfig を、そのまま貼り付けます。</p>
    <div class="two"><button class="btn d" id="lOff">連携をやめる</button><button class="btn p" id="lSave">保存して連携</button></div>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const yen=n=>n.toLocaleString('ja-JP')+'円';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isToday=t=>new Date(t).toDateString()===new Date().toDateString();
// 保存まわり（将来クラウド同期に差し替える場所）
const store={
  get(k,d){try{return JSON.parse(localStorage.getItem('pos.'+k))??d}catch{return d}},
  set(k,v){try{localStorage.setItem('pos.'+k,JSON.stringify(v))}catch{}}
};
let products=store.get('products',[]), sales=store.get('sales',[]), cart={}, editId=null, paid=0;
const TRASH='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>';
const find=id=>products.find(p=>p.id===id);
const total=()=>Object.entries(cart).reduce((t,[id,q])=>t+(find(id)?find(id).price*q:0),0);
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}

function render(){
  $('#grid').innerHTML=products.map(p=>`<button class="tile" data-add="${p.id}"><span>${esc(p.name)}</span><b>${yen(p.price)}</b></button>`).join('')+'<button class="tile new" data-new>＋ 商品を登録</button>';
  const rows=Object.entries(cart).filter(([id])=>find(id)).map(([id,q])=>{const p=find(id);
    return `<div class="row"><div class="nm"><b>${esc(p.name)}</b><small>${yen(p.price)}</small></div>
    <div class="qty"><button class="rb" data-dec="${id}" aria-label="減らす">−</button><span>${q}</span><button class="rb" data-inc="${id}" aria-label="増やす">＋</button></div>
    <div class="sub">${yen(p.price*q)}</div><button class="del" data-del="${id}" aria-label="削除">${TRASH}</button></div>`}).join('');
  $('#cart').innerHTML=rows||'<p class="empty">商品をタップすると、ここに入ります</p>';
  const t=total();$('#total').textContent=yen(t);$('#pay').disabled=!t;
}
function openProd(id){
  editId=id||null;const p=id&&find(id);
  $('#dpT').textContent=p?'商品を編集':'商品を登録';$('#pSave').textContent=p?'保存':'登録';
  $('#pn').value=p?p.name:'';$('#pp').value=p?p.price:'';
  $('#dSet').close();$('#dProd').showModal();setTimeout(()=>$('#pn').focus(),50);
}
function saveProd(){
  const name=$('#pn').value.trim(),price=Math.round(Number($('#pp').value));
  if(!name)return toast('商品名を入力してください');
  if($('#pp').value===''||!(price>=0))return toast('価格を入力してください');
  if(editId){Object.assign(find(editId),{name,price})}else{products.push({id:uid(),name,price})}
  store.set('products',products);$('#dProd').close();render();toast(editId?'保存しました':'登録しました');
}
function updPay(){
  const diff=paid-total();$('#paid').value=paid||'';
  $('#chg').textContent=diff>=0?`おつり ${yen(diff)}`:`あと ${yen(-diff)}`;$('#ok').disabled=diff<0;
}
async function confirmPay(){
  const t=total();if(!t||paid<t)return;
  const items=Object.entries(cart).filter(([id])=>find(id)).map(([id,q])=>({name:find(id).name,price:find(id).price,qty:q}));
  $('#ok').disabled=true;
  const no=await nextNo();
  const s={id:uid(),no,ts:Date.now(),items,total:t,paid,change:paid-t};
  sales.push(s);store.set('sales',sales);sendOrder(s);
  const ch=paid-t;cart={};paid=0;$('#dPay').close();render();toast(`会計完了　おつり ${yen(ch)}`);
}
function renderHist(){
  const td=sales.filter(s=>isToday(s.ts));
  $('#hsum').innerHTML=`本日の売上 <b>${yen(td.reduce((a,s)=>a+s.total,0))}</b>（${td.length}件）`;
  $('#hlist').innerHTML=td.slice().reverse().map(s=>`<div class="li"><div><b>No.${s.no}</b>　${new Date(s.ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}<small>${esc(s.items.map(i=>i.name+'×'+i.qty).join('、'))}</small></div><b>${yen(s.total)}</b></div>`).join('')||'<p class="empty">本日の会計はまだありません</p>';
}
function renderSet(){
  $('#slist').innerHTML=products.map(p=>`<div class="li"><div>${esc(p.name)}<small>${yen(p.price)}</small></div><div><button class="btn" data-edit="${p.id}">編集</button> <button class="btn d" data-rm="${p.id}">削除</button></div></div>`).join('')||'<p class="empty">商品がまだありません</p>';
}
function csv(){
  if(!sales.length)return toast('保存する売上がありません');
  const r=[['日時','注文No','商品名','単価','数量','小計']];
  sales.forEach(s=>s.items.forEach(i=>r.push([new Date(s.ts).toLocaleString('ja-JP'),s.no,i.name,i.price,i.qty,i.price*i.qty])));
  const t='\ufeff'+r.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));
  a.download='sales-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.add){cart[d.add]=(cart[d.add]||0)+1;render()}
  else if(d.inc){cart[d.inc]++;render()}
  else if(d.dec){if(--cart[d.dec]<1)delete cart[d.dec];render()}
  else if(d.del){delete cart[d.del];render()}
  else if('new' in d)openProd();
  else if('close' in d)b.closest('dialog').close();
  else if(d.edit)openProd(d.edit);
  else if(d.rm){const p=find(d.rm);if(p&&confirm(`「${p.name}」を削除しますか？`)){products=products.filter(x=>x.id!==p.id);delete cart[p.id];store.set('products',products);render();renderSet()}}
  else if(d.view)setView(d.view);
  else if(d.st){const[id,s]=d.st.split('|');setStatus(id,s)}
  else if(d.amt){if(d.amt==='exact')paid=total();else if(d.amt==='clr')paid=0;else paid+=Number(d.amt);updPay()}
});
$('#pSave').onclick=saveProd;
$('#pp').addEventListener('keydown',e=>{if(e.key==='Enter')saveProd()});
$('#pay').onclick=()=>{paid=0;$('#ptot').textContent=yen(total());updPay();$('#dPay').showModal()};
$('#paid').addEventListener('input',e=>{paid=Math.max(0,Math.round(Number(e.target.value)||0));updPay()});
$('#ok').onclick=confirmPay;
$('#clr').onclick=()=>{if(Object.keys(cart).length&&confirm('注文をすべて取り消しますか？')){cart={};render()}};
$('#bHist').onclick=()=>{renderHist();$('#dHist').showModal()};
$('#bSet').onclick=()=>{renderSet();$('#dSet').showModal()};
$('#bCsv').onclick=csv;
$('#bWipe').onclick=()=>{if(sales.length&&confirm('売上履歴をすべて削除します。元に戻せません。よろしいですか？')){sales=[];store.set('sales',sales);toast('削除しました')}};
// ===== クラウド連携（Firebase Firestore）=====
let fb=store.get('fb',null),shop=store.get('shop',''),view=store.get('view','reji'),cloud=null,orders=[],online=false,first=true;
const linked=()=>!!(fb&&shop);
const ST={new:'受付',cooking:'調理中'};
const dayKey=()=>new Date().toLocaleDateString('sv-SE');
const ago=ts=>{const m=Math.floor((Date.now()-ts)/60000);return m<1?'たった今':m+'分前'};
let ac;
function unlock(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch{}}if(ac&&ac.state==='suspended')ac.resume()}
document.addEventListener('click',unlock);
function beep(n){unlock();if(ac)for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.3;o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.18)}if(navigator.vibrate)navigator.vibrate([200,100,200])}
function parseFb(t){const o={};for(const k of['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId']){const m=t.match(new RegExp(k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));if(m)o[k]=m[1]}return o.apiKey&&o.projectId&&o.appId?o:null}
const ref=(...p)=>cloud.F.doc(cloud.db,'shops',shop,...p);
async function nextNo(){
  const local=sales.filter(s=>isToday(s.ts)).length+1;
  if(!cloud)return local;
  try{
    return await Promise.race([
      cloud.F.runTransaction(cloud.db,async t=>{const r=ref('meta','no-'+dayKey());const s=await t.get(r);const n=(s.exists()?s.data().n:0)+1;t.set(r,{n});return n}),
      new Promise((_,rej)=>setTimeout(rej,3000))]);
  }catch{return local}
}
function sendOrder(s){
  if(!cloud)return;
  cloud.F.setDoc(ref('orders',s.id),{no:s.no,ts:s.ts,items:s.items,total:s.total,status:'new'}).catch(()=>toast('注文を送れませんでした'));
}
function setStatus(id,status){
  if(!cloud)return;
  cloud.F.updateDoc(ref('orders',id),{status,[status+'At']:Date.now()}).catch(()=>toast('更新できませんでした'));
}
async function connect(){
  if(!linked())return;
  try{
    const v='10.12.2',base='https://www.gstatic.com/firebasejs/'+v+'/';
    const[A,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js')]);
    const app=A.initializeApp(fb);let db;
    try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()})}catch{db=F.getFirestore(app)}
    cloud={F,db};
    F.onSnapshot(F.query(F.collection(db,'shops',shop,'orders'),F.where('status','in',['new','cooking','done'])),snap=>{
      orders=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.ts-b.ts);
      online=!snap.metadata.fromCache;
      if(!first)snap.docChanges().forEach(c=>{
        if(c.doc.metadata.hasPendingWrites)return;
        const s=c.doc.data().status;
        if(view==='prep'&&c.type==='added'&&s==='new')beep(2);
        if(view==='reji'&&c.type==='modified'&&s==='done')beep(3);
      });
      if(!snap.metadata.fromCache)first=false;
      renderCloud();
    },err=>{online=false;renderCloud();toast('連携エラー：'+(err.code||'不明'))});
  }catch{toast('連携を開始できませんでした。設定を確認してください')}
}
function renderCloud(){
  const L=linked(),act=orders.filter(o=>o.status!=='done');
  $('#tabs').hidden=!L;
  $('#conn').className=L?(online?'on':'off'):'hide';
  $('#conn').textContent=online?'● 接続中':'● 未接続';
  $('#bd').textContent=act.length||'';
  $('#plist').innerHTML=act.map(o=>`<div class="oc ${o.status}"><div class="oh"><b>No.${o.no}</b><span>${ST[o.status]}・${ago(o.ts)}</span></div><ul>${o.items.map(i=>`<li><span>${esc(i.name)}</span><b>×${i.qty}</b></li>`).join('')}</ul><div class="two">${o.status==='cooking'?`<button class="btn" data-st="${o.id}|new">戻す</button>`:'<span></span>'}<button class="btn p" data-st="${o.id}|${o.status==='new'?'cooking':'done'}">${o.status==='new'?'調理を始める':'完成'}</button></div></div>`).join('')||'<p class="empty">いま準備する注文はありません</p>';
  $('#calls').innerHTML=orders.filter(o=>o.status==='done').map(o=>`<div class="call"><span><b>No.${o.no}</b>　完成しました</span><button class="btn p" data-st="${o.id}|handed">渡した</button></div>`).join('');
}
function setView(v){
  if(!linked())v='reji';view=v;store.set('view',v);
  $('#vReji').hidden=$('#fReji').hidden=v!=='reji';$('#vPrep').hidden=v!=='prep';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
}
$('#bLink').onclick=()=>{
  $('#dSet').close();$('#shop').value=shop;$('#fbcfg').value='';
  $('#fbcfg').placeholder=fb?'設定済みです。変更するときだけ貼り付けてください':'ここに firebaseConfig を貼り付け';
  $('#dLink').showModal();
};
$('#lSave').onclick=()=>{
  const raw=$('#fbcfg').value.trim(),c=raw?parseFb(raw):fb,sc=$('#shop').value.trim();
  if(!c)return toast('Firebase の設定を貼り付けてください');
  if(sc.length<4||/[\/\s]/.test(sc))return toast('店舗コードは4文字以上で、スペースと / は使えません');
  store.set('fb',c);store.set('shop',sc);location.reload();
};
$('#lOff').onclick=()=>{if(confirm('連携をやめますか？（この端末の売上履歴は残ります）')){localStorage.removeItem('pos.fb');localStorage.removeItem('pos.shop');location.reload()}};
setInterval(()=>{if(linked())renderCloud()},30000);
render();setView(view);renderCloud();connect();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
